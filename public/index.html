<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>GATI Course Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: one-column workbench. Header with tabs, a filter row, then summary figures, charts, tables. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#edf0f6; --ink:#141b27; --ink-2:#48536a; --ink-3:#77839a;
  --line:#dce1ea; --line-2:#c2cad8;
  --accent:#1f5bb8; --accent-ink:#ffffff; --accent-soft:#e2ebfa;
  --s-actual:#2a78d6; --s-green:#008300; --s-yellow:#eda100; --s-red:#e34948; --s-pipe:#86b6ef;
  --good-soft:#e1f3e1; --good-ink:#0a5c0a; --warn-soft:#fcefcc; --warn-ink:#6b4a00; --crit-soft:#fae2e2; --crit-ink:#8f1f1f;
  --shadow:0 1px 2px rgba(20,27,39,.06); --tier1:#e9edf5; --tier2:#d3dbeb; --tier3:#b9c5dd; --mshade:#f1f5fc;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131a; --surface:#181d26; --surface-2:#212835; --ink:#e9edf3; --ink-2:#b4bdcc; --ink-3:#8793a7;
    --line:#2a3240; --line-2:#3b4557;
    --accent:#74a9f5; --accent-ink:#0b1220; --accent-soft:#1c2b46;
    --s-actual:#3987e5; --s-green:#199e70; --s-yellow:#c98500; --s-red:#d03b3b; --s-pipe:#1c5cab;
    --good-soft:#12301c; --good-ink:#86dd9a; --warn-soft:#3a2e0c; --warn-ink:#f4c95c; --crit-soft:#3b1717; --crit-ink:#f3a0a0;
    --shadow:none; --tier1:#232b39; --tier2:#2f3a4e; --tier3:#3d4b66; --mshade:#1d2430; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#181d26; --surface-2:#212835; --ink:#e9edf3; --ink-2:#b4bdcc; --ink-3:#8793a7;
  --line:#2a3240; --line-2:#3b4557;
  --accent:#74a9f5; --accent-ink:#0b1220; --accent-soft:#1c2b46;
  --s-actual:#3987e5; --s-green:#199e70; --s-yellow:#c98500; --s-red:#d03b3b; --s-pipe:#1c5cab;
  --good-soft:#12301c; --good-ink:#86dd9a; --warn-soft:#3a2e0c; --warn-ink:#f4c95c; --crit-soft:#3b1717; --crit-ink:#f3a0a0;
  --shadow:none; --tier1:#232b39; --tier2:#2f3a4e; --tier3:#3d4b66; --mshade:#1d2430; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.app{max-width:1280px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:24px;letter-spacing:.01em}
h2{font-size:17px}
h3{font-size:14px}
p{margin:0}
.muted{color:var(--ink-3)} .sub{color:var(--ink-3);font-size:12px}
.nowrap{white-space:nowrap}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.gati-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
.gati-key b{font-family:var(--font-head);color:var(--accent)}
.role{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-2);border-radius:999px;font-size:12px;color:var(--ink-2);background:var(--surface)}
.role i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);display:inline-block}
.role.owner i{background:var(--accent)} .role.head i{background:var(--s-green)}

nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line-2);overflow-x:auto}
nav.tabs a{padding:9px 14px;text-decoration:none;color:var(--ink-2);font-family:var(--font-head);font-weight:600;font-size:15px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.count{font-family:var(--font);font-size:11px;font-weight:500;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.count.alert{background:var(--warn-soft);color:var(--warn-ink)}

main{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-b{padding:14px}
.scroll{overflow-x:auto}

.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld > span, .lab{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:var(--font-head)}
select,input[type=text],input[type=date],input[type=number],input[type=search],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 8px;min-height:34px;max-width:100%}
textarea{min-height:64px;resize:vertical}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);min-height:34px;cursor:pointer;font-size:13px}
.check input{margin:0}
.spacer{flex:1 1 auto}

button{font:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:6px 11px;min-height:34px;font-weight:500}
button:hover{border-color:var(--ink-3)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.08)}
button.sm{min-height:28px;padding:3px 8px;font-size:12px}
button.danger{color:var(--crit-ink)}
button.armed{background:var(--crit-soft);border-color:var(--crit-ink);color:var(--crit-ink)}
button:disabled{opacity:.5;cursor:not-allowed}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-family:var(--font-head);font-size:30px;font-weight:600;line-height:1.1}
.kpi .v small{font-size:14px;font-weight:500;color:var(--ink-3);font-family:var(--font)}
.kpi .d{font-size:12px;color:var(--ink-2)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.kpis{grid-template-columns:1fr}}

.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:900px){.charts{grid-template-columns:1fr}}
.charts > div{min-width:0}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;min-width:500px;height:auto}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--line-2);stroke-width:1}
.chart text{font-family:var(--font);font-size:11px;fill:var(--ink-3);font-variant-numeric:tabular-nums}
.chart text.cur{fill:var(--ink);font-weight:600}
.chart .band{fill:transparent}
.chart .band:hover{fill:var(--ink);fill-opacity:.05}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.14);padding:8px 10px;font-size:12px;min-width:170px}
.tip h4{margin:0 0 4px;font-size:12px;font-family:var(--font-head)}
.tip div{display:flex;justify-content:space-between;gap:14px;align-items:center}
.tip div span:first-child{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2)}
.tip .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;font-weight:600}

table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child > td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cur > td{background:var(--accent-soft)}
tr.tot > td{font-weight:600;border-top:1px solid var(--line-2)}
td .t{font-weight:600}
td.c-main{min-width:340px;max-width:460px}
.c-main .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.c-main > .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.acts{white-space:nowrap}
td.acts button{margin:0 4px 4px 0}
tr.hist > td{background:var(--surface-2);padding:10px 14px}
.hist ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px}
.hist time{color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.hist .who{font-weight:600}
.hist .chg{color:var(--ink-2);flex-basis:100%}
.hist .chg s{color:var(--ink-3)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill.green{background:var(--good-soft);color:var(--good-ink)} .pill.green i{background:var(--s-green)}
.pill.yellow{background:var(--warn-soft);color:var(--warn-ink)} .pill.yellow i{background:var(--s-yellow)}
.pill.red{background:var(--crit-soft);color:var(--crit-ink)} .pill.red i{background:var(--s-red)}
.pill.plain{background:var(--surface-2);color:var(--ink-2)}
.pill.live{background:var(--accent-soft);color:var(--accent)} .pill.live i{background:var(--accent)}
.pill.due{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn-ink)}
.gchip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.gchip b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-family:var(--font-head);font-size:12px}
.tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-3);vertical-align:middle}
.var{color:var(--warn-ink);font-size:12px}

.bar{display:flex;gap:2px;height:8px;min-width:120px;align-items:stretch}
.bar i{display:block;border-radius:4px;min-width:2px}
.bar .a{background:var(--s-actual)} .bar .p{background:var(--s-pipe)}

.note{padding:10px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}
.note.info{background:var(--accent-soft);border-color:transparent}
.empty{padding:36px 16px;text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:30px;padding:3px 10px;font-size:12px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:7px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.stack{display:flex;flex-direction:column;gap:12px}
.prose{max-width:68ch;color:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.prose b{color:var(--ink)}

dialog{border:1px solid var(--line-2);border-radius:10px;background:var(--surface);color:var(--ink);padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 24px)}
dialog::backdrop{background:rgba(10,14,22,.5)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.fgrid .fld select,.fgrid .fld input,.fgrid .fld textarea{width:100%}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.calc{padding:10px 12px;border-radius:6px;background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.calc b{color:var(--ink)}
.err{color:var(--crit-ink);font-size:13px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.stats{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;padding:0 2px}
td.labs{font-size:12px;color:var(--ink-2);min-width:150px}
.labgrid{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;margin-top:6px;align-items:center}
.labgrid select,.labgrid input{width:100%}
.labgrid .cls{font-size:13px;color:var(--ink-2)}
.fgrid .check.wide{grid-column:1/-1}
tr.t1 > td{background:var(--tier1);font-weight:600}
tr.t2 > td{background:var(--tier2);font-weight:600}
tr.t3 > td{background:var(--tier3);font-weight:700}
.tblnote{padding:8px 14px 12px}
.ms{position:relative}
.ms-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:118px;max-width:230px;text-align:left;font-weight:400}
.ms-btn > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.caret{width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--ink-3);flex:none}
.ms-pop{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:230px;max-width:min(360px,calc(100vw - 32px));max-height:470px;overflow:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:8px;display:flex;flex-direction:column;gap:2px}
.ms-opt{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:13px}
.ms-opt:hover{background:var(--surface-2)}
.ms-opt input{margin:0;flex:none}
.ms-all{align-self:flex-start;margin-bottom:4px}
.ms-quick{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.ms-pop{position:fixed;left:16px;right:16px;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:none;max-height:60vh}}
.totals{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.tot-items{display:flex;flex-wrap:wrap;gap:10px 30px}
.tot-items > div{display:flex;flex-direction:column;gap:2px}
.tot-items b{font-family:var(--font-head);font-size:22px;line-height:1.1}
.hov{border-bottom:1px dotted var(--ink-3);cursor:help}
td[data-tip]{cursor:help}
.ftip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:6px;padding:7px 10px;font-size:12px;line-height:1.5;white-space:pre-line;max-width:300px;font-variant-numeric:tabular-nums}

table.mq th.grp{text-align:center}
table.mq .gs{border-left:1px solid var(--line-2)}
table.mq td.tcol{font-weight:600}
table.mq th{padding-left:8px;padding-right:8px}
tr.addrow > td{padding:6px 10px}
.addnew{border-style:dashed;width:100%;justify-content:center;display:flex;gap:8px;align-items:center;color:var(--ink-2);background:transparent}
.addnew b{font-size:18px;line-height:1;color:var(--accent)}
.addnew:hover{color:var(--ink);border-color:var(--accent)}
.reset{border-color:transparent;background:transparent;color:var(--accent);padding-inline:8px;display:inline-flex;gap:6px;align-items:center}
.reset:hover{background:var(--accent-soft);border-color:transparent}
.reset:disabled{color:var(--ink-3);opacity:.7}
.reset span{font-size:16px;line-height:1}
.who{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:flex-end}
.who .me{font-size:13px;color:var(--ink-2);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel.auth{max-width:440px;margin:24px auto 0;width:100%}
.panel.auth .dlg .fld input{width:100%}
.linkish{border:0;background:transparent;color:var(--accent);padding-inline:4px;margin-right:auto}
.linkish:hover{text-decoration:underline}
.th-f{display:inline-flex;align-items:center;gap:4px}
.hf{border:0;background:transparent;padding:3px;min-height:0;border-radius:4px;color:var(--ink-3);display:inline-flex;line-height:0}
.hf:hover{background:var(--surface-2);color:var(--ink)}
.hf.on{background:var(--accent);color:var(--accent-ink)}
.hf svg,.hfhint svg{width:11px;height:11px}
.hfhint{display:inline-flex;align-items:center;gap:5px;align-self:center}
.hfhint svg{fill:currentColor}
.ms-pop.hpop{position:fixed;text-transform:none;letter-spacing:0;font-family:var(--font);font-weight:400;font-size:13px;color:var(--ink);white-space:normal;z-index:40}
.ms-pop hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.ms-sec-t{font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:2px 6px 4px}
tr.t4 > td{background:var(--tier3);font-weight:700;border-top:2px solid var(--ink-3)}
.calnav{display:flex;gap:4px;align-items:center}
.calnav button{min-width:34px}
.calnav input{min-height:34px}
.cal-head{display:flex;flex-direction:column;gap:4px;min-width:0}
.g-sum{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--ink-2)}
.g-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.sw-online{background:repeating-linear-gradient(135deg,var(--ink-3) 0 2px,transparent 2px 4px)}
.gantt{--lw:300px;overflow:auto;max-height:calc(100vh - 230px);min-height:320px;position:relative;border-top:1px solid var(--line)}
@media (max-width:700px){.gantt{--lw:150px}}
.g-head{position:sticky;top:0;z-index:5;background:var(--surface);width:max-content;min-width:100%}
.g-hrow{display:flex;border-bottom:1px solid var(--line-2)}
.g-corner{position:sticky;left:0;z-index:6;background:var(--surface);width:var(--lw);flex:none;padding:4px 10px;font-family:var(--font-head);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-right:1px solid var(--line-2);box-sizing:border-box;display:flex;align-items:center}
.g-cells{display:flex;flex:none}
.g-cell{flex:none;box-sizing:border-box;border-left:1px solid var(--line);text-align:center;font-size:11px;color:var(--ink-3);overflow:hidden;white-space:nowrap;padding:3px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.g-cell b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.g-cell .wd{font-size:10px}

var LABELS={expectedEnd:'Expected end',startBatch:'Learners started',title:'Course name',batch:'Batch / code',client:'Client / source',programType:'Programme type',gati:'GATI',school:'School',campus:'Campus',mode:'Mode',plannedStart:'Planned start',plannedEnd:'Planned end',batchSize:'Planned batch size',confidence:'Confidence',notes:'Notes',sat:'Saturdays count',trainingDays:'Training days',actualStart:'Actual start',actualEnd:'Actual end',actualBatch:'Actual throughput',male:'Male',female:'Female',labs:'Lab split',classPct:'Classroom %'};
var ACTIONS={acknowledged:'Acknowledged: course available','batch-confirmed':'Batch confirmed: moved to Batches · Standby',started:'Batch started: moved to Running batches',completed:'Batch completed: moved to Actuals',created:'Added to pipeline','created-actual':'Added directly to actuals by the program team',imported:'Imported',edited:'Edited',confirmed:'Moved to actuals and locked',dropped:'Marked as dropped',restored:'Restored to pipeline','edit-requested':'Requested an edit',unlocked:'Unlocked for one edit','request-declined':'Declined the edit request','edited-locked':'Edited a locked record'};

var TABS=[['dashboard','Dashboard'],['actuals','Actuals'],['batches','Batches'],['pipeline','Pipeline'],['calendar','Calendar'],['setup','Setup']];

var S={db:null,auth:null,authState:'loading',me:{id:null,name:'',email:'',role:'',gatis:[],isOwner:false},users:[],courses:[],config:null,names:{},
  loaded:false,slow:false,err:null,tab:'dashboard',holSet:new Set(),openHist:new Set(),armed:null,online:false,
  openMs:null,mview:'both',dl:null,
  cal:{view:'month',anchor:today(),group:'school',scrollKey:'',jump:today().slice(0,8)+'01',keepDate:null},

  bf:{fys:null,smonths:null,emonths:null,gati:null,school:null,campus:null,mode:null,ptype:null,q:'',view:'running'},logId:null,logKey:'',
  f:{fys:curFY(),months:null,gati:null,school:null,campus:null,mode:null,ptype:null,conf:null,by:'school'},
  pf:{fys:curFY(),smonths:null,emonths:null,gati:null,school:null,campus:null,mode:null,ptype:null,conf:null,status:null,q:'',view:'active'},

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];});}
function num(n){return Math.round(Number(n)||0).toLocaleString('en-IN');}
function $(id){return document.getElementById(id);}
function pd(s){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));}
function fd(d){return d.toISOString().slice(0,10);}
function today(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');}
function nice(s){if(!s)return '—';var d=pd(s);return d.getUTCDate()+' '+MON[d.getUTCMonth()]+' '+String(d.getUTCFullYear()).slice(2);}
function monthLabel(k){var p=k.split('-');return MON[Number(p[1])-1]+' '+p[0].slice(2);}

function stamp(iso){if(!iso)return '';var d=new Date(iso);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function sum(o){var t=0;for(var k in o)t+=o[k];return t;}
function cfg(){var c=S.config||{};var o=c.owners||{};return {schools:Array.isArray(c.schools)&&c.schools.length?c.schools:DEFAULT_SCHOOLS,labs:Array.isArray(c.labs)&&c.labs.length?c.labs:DEFAULT_LABS,holidays:Array.isArray(c.holidays)?c.holidays:[],owners:{G:o.G||[],A:o.A||[],T:o.T||[],I:o.I||[],N:o.N||[]},headNames:c.headNames||{}};}
function gatiLong(g){return g.k==='N'?'NST':g.k+' · '+g.n;}
function gatiName(k){var g=GATI.filter(function(x){return x.k===k;})[0];return g?g.n:'Unassigned';}
function modeName(k){var m=MODES.filter(function(x){return x.k===k;})[0];return m?m.n:(k||'—');}
function confName(k){var c=CONF.filter(function(x){return x.k===k;})[0];return c?c.n:'In process';}
function nameOf(id){if(!id)return '—';if(id===S.me.id)return S.me.name||'You';return S.names[id]||'Someone';}
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true;},3800);}

/* Working days between two dates: Monday to Friday (plus Saturday when the course says so), minus listed holidays, grouped by month. */
var memo=new Map();
function wdays(start,end,sat){if(!start||!end||end<start)return {};var key=start+end+(sat?'s':'');var hit=memo.get(key);if(hit)return hit;
  var out={},d=pd(start),e=pd(end),g=0;
  while(d<=e&&g++<3700){var w=d.getUTCDay(),s=fd(d);if(w!==0&&(w!==6||sat)&&!S.holSet.has(s)){var k=s.slice(0,7);out[k]=(out[k]||0)+1;}d=new Date(d.getTime()+86400000);}
  memo.set(key,out);return out;}
function cdays(start,end){var out={},d=pd(start),e=pd(end),g=0;while(d<=e&&g++<3700){var k=fd(d).slice(0,7);out[k]=(out[k]||0)+1;d=new Date(d.getTime()+86400000);}return out;}
function eff(c){if(c.stage==='actual')return {start:c.actualStart,end:c.actualEnd,batch:Number(c.actualBatch)||0};
  if(c.stage==='running')return {start:c.actualStart||c.plannedStart,end:c.expectedEnd||c.plannedEnd,batch:Number(c.startBatch!=null?c.startBatch:c.batchSize)||0};
  return {start:c.plannedStart,end:c.plannedEnd,batch:Number(c.batchSize)||0};}
function isDone(c){return c.stage==='actual'||c.stage==='running';}
/* GATI pipeline: awaiting course production → acknowledged (upcoming) → start date reached (ready). Running: running → end date reached (due). */
var ADMIN='ram.viswanath@tataiis.org';
/* Pipeline review: awaiting (course production to upload) → review (GATI head to review) → changes (back to course production) → approved (GATI head to confirm the batch). */
function pipeStatus(c){return c.review||'awaiting';}
function sbStatus(c){var t=today();return t>=c.plannedStart?'due':'waiting';}
function runStatus(c){return today()>=eff(c).end?'due':'running';}
/* Training days per month. A "training days" figure on the course overrides the count and is spread across the months in proportion. */
function planOf(start,end,sat,td){var m=wdays(start,end,sat),wd=sum(m);td=Number(td)||0;
  if(td>0&&td!==wd&&start&&end&&end>=start){var base=wd?m:cdays(start,end),bt=sum(base),out={};for(var k in base)out[k]=base[k]*td/bt;return {days:td,months:out,range:wd,over:true};}

function plan(c){var e=eff(c);return planOf(e.start,e.end,!!c.sat,c.trainingDays);}
function counted(c){return c.mode!=='Online'||S.online;}
function tpdOf(c){return counted(c)?plan(c).days*eff(c).batch:0;}
function valid(c){var e=eff(c);return !!(e.start&&e.end&&e.end>=e.start);}
function liveStatus(c){return c.stage==='running'?runStatus(c):c.stage==='standby'?sbStatus(c):pipeStatus(c);}

/* ---------- permissions (app level) ---------- */
function myGatis(){return (S.me.gatis||[]).slice();}
function canAdd(){return S.me.isAdmin||myGatis().length>0;}
function ownsGati(c){return S.me.isAdmin||myGatis().indexOf(c.gati)>=0;}
function canEditCourse(c){if(S.me.isAdmin)return true;
  if(c.stage==='pipeline'||c.stage==='dropped')return ownsGati(c)&&(c.stage==='pipeline'||pipeStatus(c)!=='approved');
  if(c.stage==='standby'||c.stage==='running')return S.me.isOwner;
  if(c.stage==='actual')return S.me.isOwner||(ownsGati(c)&&!!c.unlocked);return false;}
function isCPUser(){return S.me.role==='cp'||S.me.isAdmin;}
function canUpload(c){return c.stage==='pipeline'&&isCPUser()&&(pipeStatus(c)==='awaiting'||pipeStatus(c)==='changes');}

/* ---------- periods ---------- */
function fyOf(dateStr){var y=Number(dateStr.slice(0,4)),m=Number(dateStr.slice(5,7));return m>=4?y:y-1;}
function fyMonths(fy){var out=[];for(var i=0;i<12;i++){var m=(3+i)%12,y=fy+(3+i>=12?1:0);out.push(y+'-'+String(m+1).padStart(2,'0'));}return out;}

function selIdx(sel){var a=[];for(var i=0;i<12;i++)if(!sel||sel[i])a.push(i);return a;}
function periodMonths(fy,sel){var all=fyMonths(fy);return selIdx(sel).map(function(i){return all[i];});}

  for(var q=1;q<QUICK.length;q++){if(a.length===QUICK[q][2]-QUICK[q][1]&&a[0]===QUICK[q][1]&&a[a.length-1]===QUICK[q][2]-1)return QUICK[q][0];}
  if(a.length<=3)return a.slice().sort(function(x,y){return (3+x)%12-(3+y)%12;}).map(function(i){return MON[(3+i)%12];}).join(', ');return a.length+' months';}
function periodLabel(fy,sel){var a=selIdx(sel);if(a.length===12)return fyLabel(fy);if(a.length===1)return monthLong(fyMonths(fy)[a[0]]);return monthsText(sel)+' '+fyLabel(fy);}
function inMonths(c,set){var e=eff(c),p=plan(c);if(set[e.end.slice(0,7)]||set[e.start.slice(0,7)])return true;for(var k in p.months)if(set[k])return true;return false;}
function toSet(a){var s={};a.forEach(function(k){s[k]=1;});return s;}
function curFY(){var o={};o[fyOf(today())]=1;return o;}
function fyList(f){var all=fyOptions();return f.fys?all.filter(function(y){return f.fys[y];}):all;}

/* ---------- aggregation ---------- */
function blank(){return {actual:0,green:0,yellow:0,red:0};}
function bucket(c){return isDone(c)?'actual':c.stage==='standby'?'green':(c.confidence||'yellow');}
function dashCourses(){var f=S.f;return S.courses.filter(function(c){return (isDone(c)||c.stage==='pipeline'||c.stage==='standby')&&valid(c)&&pass(c,f,FKEYS)&&(isDone(c)||!f.conf||f.conf[bucket(c)||c.confidence||'yellow']);});}
function accum(){return {tp:blank(),tpd:blank(),starts:{a:0,p:0},ends:{a:0,p:0}};}
function aggregate(list,months){var M={};months.forEach(function(m){M[m]=accum();});
  list.forEach(function(c){var e=eff(c),p=plan(c),b=bucket(c),cnt=counted(c),sk=isDone(c)?'a':'p';
    if(cnt)for(var k in p.months){if(M[k])M[k].tpd[b]+=p.months[k]*e.batch;}
    var em=e.end.slice(0,7),sm=e.start.slice(0,7);if(M[em]){M[em].tp[b]+=e.batch;M[em].ends[sk]++;}if(M[sm])M[sm].starts[sk]++;});
  return M;}
function pipeOf(o){return o.green+o.yellow+o.red;}
function addInto(t,a){for(var k in t)t[k]+=a[k];}
function accAdd(t,a){addInto(t.tp,a.tp);addInto(t.tpd,a.tpd);addInto(t.starts,a.starts);addInto(t.ends,a.ends);}

  if(c&&c.stage==='pipeline'){if(st==='awaiting')return '<span class="pill yellow"><i></i>With course production · upload</span>';if(st==='review')return '<span class="pill live"><i></i>With GATI head · review</span>';if(st==='changes')return '<span class="pill red"><i></i>Changes asked · with course production</span>';if(st==='approved')return '<span class="pill green"><i></i>Course approved · confirm batch</span>';}
  if(c&&c.stage==='standby'){if(st==='due')return '<span class="pill due">Start day reached</span>';var dd=dayDiff(today(),c.plannedStart);return '<span class="pill plain">Starts in '+dd+' day'+(dd===1?'':'s')+'</span>';}
  if(st==='due')return '<span class="pill due">Due to complete</span>';
  if(st==='running'&&c)return '<span class="pill live"><i></i>Running</span>';
if(st==='running')return '<span class="pill live"><i></i>In progress</span>';if(st==='ended')return '<span class="pill due">Ended · confirm</span>';return '<span class="pill plain">Upcoming</span>';}

  return '<span class="hov"'+tip(lines.join('\n'))+'>'+num(p.days*b)+'</span>';}

/* ----- dashboard ----- */
function niceScale(mx){var raw=mx/4,p=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1)))),c=[1,2,5,10].map(function(x){return x*p;}).filter(function(x){return x>=raw;})[0]||10*p;var step=Math.max(1,c);return {step:step,top:Math.max(step,Math.ceil(mx/step)*step)};}

    segs.forEach(function(s,j){var h=(M[m][metric][s.k]/sc.top)*ph,gap=j>0?2:0,hh=Math.max(1,h-gap),y=y0-h,last=j===segs.length-1;
      if(last){var r=Math.min(4,hh,bw/2);g+='<path fill="'+s.c+'" d="M'+x+','+(y+hh)+' V'+(y+r)+' Q'+x+','+y+' '+(x+r)+','+y+' H'+(x+bw-r)+' Q'+(x+bw)+','+y+' '+(x+bw)+','+(y+r)+' V'+(y+hh)+' Z"/>';}
      else g+='<rect fill="'+s.c+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'"/>';
      y0-=h;});
    g+='<text class="'+(m===cur?'cur':'')+'" x="'+(L+i*band+band/2)+'" y="'+(H-10)+'" text-anchor="middle">'+(months.length>12?(i%3===0?MON[Number(m.slice(5))-1]+' '+m.slice(2,4):''):MON[Number(m.slice(5))-1])+'</text>';

/* ----- calendar (Gantt) ----- */
var CALV=[['day','Day'],['week','Week'],['month','Month'],['year','Year']];

function addDays(s,n){return fd(new Date(pd(s).getTime()+n*86400000));}
function dayDiff(a,b){return Math.round((pd(b)-pd(a))/86400000);}
function monthStart(s,add){var d=pd(s);return fd(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+(add||0),1)));}
function monthEnd(s){var d=pd(s);return fd(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)));}
function weekStart(s){return addDays(s,-((pd(s).getUTCDay()+6)%7));}
function weekLabel(k){var e=addDays(k,6),a=pd(k),b=pd(e);return a.getUTCDate()+(a.getUTCMonth()!==b.getUTCMonth()?' '+MON[a.getUTCMonth()]:'')+(a.getUTCFullYear()!==b.getUTCFullYear()?' '+a.getUTCFullYear():'')+' – '+b.getUTCDate()+' '+MON[b.getUTCMonth()]+' '+b.getUTCFullYear();}
/* The strip views (week, month) are split into segments: weeks or months. */
function segKey(v,d){return v==='week'?weekStart(d):d.slice(0,7);}
function segTitle(v,k){return v==='week'?'Week of '+weekLabel(k):monthLong(k);}
function segSummary(v,k){return v==='week'?weekSummary(k):monthSummary(k);}
function longDate(s){var d=pd(s);return WD[d.getUTCDay()]+' '+d.getUTCDate()+' '+MONL[d.getUTCMonth()]+' '+d.getUTCFullYear();}
/* Month view is one long strip: six months either side of the month in view, re-centred as you scroll. */
function calRange(){var v=S.cal.view,a=S.cal.anchor,d=pd(a);
  if(v==='day')return [a,a];
  if(v==='week'){var s0=weekStart(a);return [addDays(s0,-56),addDays(s0,62)];}
  if(v==='month')return [monthStart(a,-6),monthEnd(monthStart(a,6))];
  var fy=fyOf(a);return [fy+'-04-01',(fy+1)+'-03-31'];}
function calStep(dir){var v=S.cal.view,a=S.cal.anchor;
  if(v==='day')S.cal.anchor=addDays(a,dir);else if(v==='week'){S.cal.anchor=addDays(weekStart(a),7*dir);S.cal.jump=S.cal.anchor;}
  else if(v==='month'){S.cal.anchor=monthStart(a,dir);S.cal.jump=S.cal.anchor;}
  else S.cal.anchor=(fyOf(a)+dir)+'-04-01';}
function calLabel(r){var v=S.cal.view;
  if(v==='day')return longDate(r[0]);
  if(v==='week')return segTitle('week',weekStart(S.cal.anchor));
  if(v==='month')return monthLong(S.cal.anchor.slice(0,7));return fyLabel(fyOf(r[0]))+' · April to March';}
function trains(c,day){var w=pd(day).getUTCDay();return w!==0&&(w!==6||!!c.sat)&&!S.holSet.has(day);}
function calCourses(r){return S.courses.filter(function(c){if((!isDone(c)&&c.stage!=='pipeline'&&c.stage!=='standby')||!valid(c))return false;var e=eff(c);
  return e.end>=r[0]&&e.start<=r[1]&&pass(c,S.kf,FKEYS.concat(['kind']));}).sort(function(a,b){var x=eff(a),y=eff(b);return x.start<y.start?-1:x.start>y.start?1:(x.end<y.end?-1:1);});}
function kindName(c){return c.stage==='actual'?'Completed':c.stage==='running'?'Running batch':c.stage==='standby'?'Standby · batch confirmed':'Pipeline · '+confName(c.confidence);}
function barTip(c){var e=eff(c),p=plan(c);return [c.title,[c.batch,c.client].filter(Boolean).join(' · '),gatiName(c.gati)+' · '+(c.school||'No school'),(c.campus||'')+' · '+modeName(c.mode),nice(e.start)+' → '+nice(e.end)+' · '+Math.round(p.days*10)/10+' training days',(c.stage==='actual'?'Throughput: ':c.stage==='running'?'Learners started: ':'Batch size: ')+num(e.batch),kindName(c)].filter(Boolean).join('\n');}

function submitCourse(form){
  var id=form.dataset.id,c=id?byId(id):null,na=form.dataset.na==='1'&&S.me.isOwner,isA=na||(c&&c.stage==='actual'),isR=c&&c.stage==='running';
  var td=$('cf-td').value;

  var s=$('cf-start').value,e=$('cf-end').value,b=Math.round(Number($('cf-batch').value));
  if(!v.title)return showErr('cf','Enter the course name.');
  if((!v.gati&&!S.me.isOwner)||!v.school||!v.campus)return showErr('cf','Choose the GATI source, school and campus.');
  if(!s||!e)return showErr('cf','Enter both dates.');
  if(e<s)return showErr('cf','The end date is before the start date.');
  if(!(b>=1))return showErr('cf','Enter the number of learners.');
  if(isA&&e>today())return showErr('cf','An actual end date cannot be in the future.');
  if(isA){var x=readExtras('cf',b);if(x.err)return showErr('cf',x.err);v.actualStart=s;v.actualEnd=e;v.actualBatch=b;v.labs=x.labs;v.classPct=x.classPct;v.male=x.male;v.female=x.female;}
  else if(isR){v.actualStart=s;v.expectedEnd=e;v.startBatch=b;}
  else{v.plannedStart=s;v.plannedEnd=e;v.batchSize=b;v.confidence=$('cf-conf').value;}
  guard(function(){var now=new Date().toISOString();

      if(na){v.plannedStart=v.actualStart;v.plannedEnd=v.actualEnd;v.batchSize=v.actualBatch;v.confidence='green';v.confirmedBy=S.me.id;v.confirmedAt=now;v.unlocked=false;v.editRequest=null;}
      return S.db.collection('courses').doc().set(v).then(function(){closeDlg();toast(na?'Added to actuals and locked':'Added to the pipeline');});}
    if(c.stage==='pipeline'&&pipeStatus(c)!=='awaiting'&&!S.me.isAdmin){delete v.title;delete v.gati;delete v.school;}
    var changes=[];Object.keys(v).forEach(function(k){if(norm(c[k])!==norm(v[k]))changes.push({f:k,from:c[k]==null?null:c[k],to:v[k]});});
    if(!changes.length){closeDlg();return;}

    if(isA&&!S.me.isOwner){patch.unlocked=false;patch.editRequest=null;}
