# Publishes the site and the database rules to Firebase whenever main changes.
# Google trusts only this repository's main branch (keyless sign-in, no stored secrets).
name: Publish to Firebase

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/668611637952/locations/global/workloadIdentityPools/github/providers/gati-repo
          service_account: github-deployer@gati-course-tracker.iam.gserviceaccount.com

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish site and database rules
        run: npx --yes firebase-tools@13.29.1 deploy --only hosting,firestore:rules --project gati-course-tracker --non-interactive --debug
